name: Deploy Website

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'OdeliaWatt/dsh-limited-vinta__awesome-python-20261029'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://awesome-python.com/
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@0ca8f610542aa7f4acaf39e65cf4eb3c35091883 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group build --locked

      - name: Run tests
        if: github.event_name == 'schedule'
        run: make test

      - name: Get current UTC date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore star data cache
        id: cache-stars
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: website/data/github_stars.json
          key: github-stars-${{ steps.date.outputs.today }}
          restore-keys: |
            github-stars-

      - name: Fetch GitHub stars
        id: fetch-stars
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make fetch_github_stars

      - name: Save star data cache
        if: steps.fetch-stars.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: website/data/github_stars.json
          key: github-stars-${{ steps.date.outputs.today }}

      - name: Verify star data
        run: |
          if [ ! -f website/data/github_stars.json ]; then
            echo "::error::website/data/github_stars.json is missing; no cache was restored and star fetching failed."
            exit 1
          fi
          python3 -m json.tool website/data/github_stars.json > /dev/null

      - name: Build website
        run: make build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/output/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
